<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeGuard 자동 데모</title>
<style>
  :root{--bg:#0B0B0F;--surf:#15161A;--surf2:#1B1D22;--line:#25272E;--text:#FFFFFF;--muted:#9BA0A8;
    --green:#29D17F;--crit:#FF4D4D;--high:#FF8A3D;--med:#FFC53D;--low:#5AA2FF;--slop:#C8A2FF;
    --mono:Consolas,'Courier New',monospace;
    --sans:'Malgun Gothic','맑은 고딕',system-ui,-apple-system,'Segoe UI',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
  #app{height:100vh;display:grid;place-items:center;overflow:hidden}
  /* 고정 설계 크기(16:9)를 JS 로 화면에 맞춰 확대 — 어떤 해상도에서도 비율·글자 크기가 함께 커진다 */
  #stage{width:1040px;height:585px;background:var(--bg);position:relative;
    border:1px solid var(--line);border-radius:18px;overflow:hidden;transform-origin:center center}
  body.playing{cursor:none}
  .scene{position:absolute;inset:0;padding:46px 52px;opacity:0;transition:opacity .6s ease;
    display:flex;flex-direction:column;justify-content:center}
  .scene.on{opacity:1}
  .kicker{color:var(--green);font-weight:700;font-size:18px;letter-spacing:.5px;margin-bottom:14px}
  .big{font-size:40px;font-weight:700;line-height:1.25}
  .big .g{color:var(--green)}
  .sub{color:var(--muted);font-size:20px;margin-top:16px;line-height:1.5}
  .brandrow{display:flex;align-items:center;gap:16px}
  .logo{width:64px;height:64px;border-radius:16px;background:#000;border:1px solid var(--line);
    display:grid;place-items:center}
  .title{font-size:46px;font-weight:700}
  .stat{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap}
  .stat div b{display:block;font-size:34px;font-weight:700}
  .stat div span{color:var(--muted);font-size:15px}
  .term{background:#0E0F13;border:1px solid var(--line);border-radius:12px;padding:18px 20px;
    font-family:var(--mono);font-size:18px;color:#D6DAE2;margin-top:10px}
  .term .p{color:var(--green)}
  .cards{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .card{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:12px;padding:12px 15px;opacity:0;transform:translateY(8px);
    transition:opacity .45s,transform .45s}
  .card.show{opacity:1;transform:none}
  .card .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;color:#0B0B0F}
  .ttl{font-weight:700;font-size:17px}
  .rid{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--surf2);
    border:1px solid var(--line);padding:1px 7px;border-radius:6px}
  .slopt{font-size:12px;font-weight:700;color:#2a1a4a;background:var(--slop);padding:2px 8px;border-radius:6px}
  .cvet{font-size:12px;font-weight:700;color:#0B0B0F;background:var(--green);padding:2px 8px;border-radius:6px}
  .csnip{font-family:var(--mono);font-size:14px;color:var(--muted);margin-top:7px}
  .score{display:flex;align-items:center;gap:28px}
  .ring{width:150px;height:150px;border-radius:50%;border:10px solid var(--crit);display:grid;
    place-items:center;flex:0 0 auto}
  .ring .n{font-size:50px;font-weight:800}
  .gradeF{display:inline-block;background:var(--crit);color:#0B0B0F;font-weight:700;font-size:20px;
    padding:3px 16px;border-radius:999px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--line);
    border-radius:999px;padding:6px 13px;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%}
  .drop{margin-top:18px;border:2px dashed #3A3D46;border-radius:16px;padding:26px;text-align:center;color:var(--muted);font-size:18px}
  .drop b{color:var(--text)}
  .winframe{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0E0F13}
  .winbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#17181D;border-bottom:1px solid var(--line)}
  .wd{width:11px;height:11px;border-radius:50%}.wd.r{background:#FF5F57}.wd.y{background:#FEBC2E}.wd.g{background:#28C840}
  .addr{margin-left:8px;font-family:var(--mono);font-size:13px;color:var(--muted);background:#0E0F13;border:1px solid var(--line);border-radius:6px;padding:3px 12px}
  .apptt{margin-left:8px;font-size:13px;color:var(--muted)}
  .shot{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#0B0B0F}
  #caption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);
    padding:16px 24px;font-size:21px;line-height:1.5;min-height:64px;display:flex;align-items:center;
    border-top:1px solid var(--line)}
  #bar{position:absolute;left:0;top:0;height:4px;background:var(--green);width:0;z-index:5}
  #start{position:absolute;inset:0;background:rgba(11,11,15,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:9;cursor:pointer;padding:30px}
  #start .b{font-size:26px;font-weight:700}
  #start .play{width:78px;height:78px;border-radius:50%;background:var(--green);color:#062012;
    display:grid;place-items:center;font-size:30px;font-weight:800}
  .checklist{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 22px;
    font-size:15px;color:var(--muted);line-height:1.9;text-align:left;min-width:430px}
  .checklist b{color:var(--text)}
  .checklist .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--surf2);
    border:1px solid var(--line);color:var(--green);font-size:12px;font-weight:700;text-align:center;
    line-height:19px;margin-right:8px}
  #voicechk{font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--surf2);display:inline-flex;align-items:center;gap:8px}
  #voicetest{cursor:pointer;border:1px solid var(--green);background:transparent;color:var(--green);
    font-family:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:5px 13px}
  #cd{font-size:150px;font-weight:800;color:var(--green);line-height:1}
  #done{position:absolute;right:14px;bottom:78px;font-size:13px;color:var(--muted);
    background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    opacity:0;transition:opacity .6s;z-index:6}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bar"></div>
    <div id="scene" class="scene"></div>
    <div id="caption"></div>
    <div id="done">재생 완료 — 이제 녹화를 멈추세요 (Win+Alt+R)</div>
    <div id="start">
      <div class="play">▶</div>
      <div class="b">VibeGuard 자동 데모</div>
      <div id="voicechk">음성 확인 중…</div>
      <div class="checklist">
        <div><span class="n">1</span><b>F11</b> 로 전체화면</div>
        <div><span class="n">2</span>위 <b>음성 테스트</b> 로 소리 확인</div>
        <div><span class="n">3</span><b>Win + Alt + R</b> 로 화면 녹화 시작</div>
        <div><span class="n">4</span>여기를 <b>클릭</b>(또는 스페이스) → 3초 뒤 자동 재생</div>
      </div>
    </div>
  </div>
</div>
<script>
var SHIELD='<svg width="38" height="38" viewBox="0 0 1024 1024"><path d="M300 256 Q284 256 284 272 L284 528 C284 612 372 700 512 786 C652 700 740 612 740 528 L740 272 Q740 256 724 256 Z" fill="#fff"/><path d="M430 508 L492 566 L612 438" fill="none" stroke="#29D17F" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function card(sev,col,title,rid,snip,tag){
  return '<div class="card" data-card style="border-left-color:'+col+'">'
    +'<div class="h"><span class="badge" style="background:'+col+'">'+sev+'</span>'
    +'<span class="ttl">'+title+'</span><span class="rid">'+rid+'</span>'
    +(tag==='slop'?'<span class="slopt">공급망/슬롭스쿼팅</span>':'')
    +(tag==='cve'?'<span class="cvet">알려진 취약점(CVE)</span>':'')+'</div>'
    +'<div class="csnip">'+snip+'</div></div>';
}
var SCENES=[
 {dur:9000,cap:"요즘은 코딩을 몰라도 AI에게 맡겨 앱과 서비스를 만드는 시대입니다. 이걸 '바이브코딩'이라고 부릅니다.",
  html:'<div class="brandrow"><div class="logo">'+SHIELD+'</div><div class="title">VibeGuard</div></div>'
   +'<div class="sub">바이브코딩을 위한 보안 가드레일 — AI가 만든 코드의 취약점과 가짜 패키지를 잡아냅니다.</div>'},
 {dur:10000,cap:"그런데 AI가 만든 코드의 약 45%에 보안 취약점이 섞여 있다는 분석이 있습니다. 비전문가에게 보안은 너무 어렵습니다.",
  html:'<div class="kicker">왜 필요한가</div><div class="big">AI가 만든 코드,<br><span class="g">그대로 배포해도 안전할까요?</span></div>'
   +'<div class="sub">하드코딩된 키 · eval 코드 실행 · SQL 인젝션 · 약한 암호 · 가짜 패키지…<br>좋은 아이디어가 보안 사고 한 번으로 무너질 수 있습니다.</div>'},
 {dur:10000,cap:"사용법은 이게 전부입니다. 내려받은 실행파일을 더블클릭하면 이 창이 뜹니다. 검사 실행, 이전 검사 결과, 설정. 버튼 세 개뿐입니다.",
  html:'<div class="kicker">실행파일을 더블클릭하면</div>'
   +'<div class="winframe"><div class="winbar"><span class="wd r"></span><span class="wd y"></span><span class="wd g"></span><span class="apptt">VibeGuard — 바이브코딩 보안 스캐너</span></div>'
   +'<img src="../assets/app-home.png" class="shot" alt="VibeGuard 앱 홈 화면"></div>'},
 {dur:10000,cap:"검사 실행을 누르고, 검사할 폴더를 창에 끌어다 놓기만 하면 됩니다. 터미널도, 브라우저도, 파이썬도 필요 없습니다.",
  html:'<div class="kicker">폴더를 끌어다 놓으면 끝</div>'
   +'<div class="winframe"><div class="winbar"><span class="wd r"></span><span class="wd y"></span><span class="wd g"></span><span class="apptt">VibeGuard — 검사 실행</span></div>'
   +'<img src="../assets/app-scan.png" class="shot" alt="폴더 드래그앤드롭 화면"></div>'},
 {dur:11000,cap:"놓는 즉시 검사가 돌고, 결과가 같은 창 안에 바로 나옵니다. 점수와 등급, 그리고 무엇이 왜 위험한지까지 한 화면에서 볼 수 있습니다.",
  html:'<div class="kicker">결과도 이 창 안에서</div>'
   +'<div class="winframe"><div class="winbar"><span class="wd r"></span><span class="wd y"></span><span class="wd g"></span><span class="apptt">VibeGuard — 검사 결과</span></div>'
   +'<img src="../assets/app-result.png" class="shot" alt="VibeGuard 검사 결과 화면"></div>'},
 {dur:13000,cap:"숨어 있던 문제들이 심각한 순서대로 정리되어 나옵니다. 각 항목마다 어디가, 왜 위험한지 보여줍니다.",
  reveal:true,
  html:'<div class="kicker">탐지 결과</div><div class="cards">'
   +card('치명적','var(--crit)','eval()로 외부 입력 실행 — 원격 코드 실행','VG-EXEC','server.js:38  const result = eval(req.query.expr);')
   +card('높음','var(--high)','TLS 인증서 검증 비활성화','VG-WEB','server.js:43  rejectUnauthorized: false')
   +card('중간','var(--med)','MD5로 비밀번호 해시 — 취약한 암호','VG-CRYPTO','app.py:45  hashlib.md5(pw)')
   +'</div>'},
 {dur:11000,cap:"가장 특징적인 기능입니다. AI가 지어낸 가짜 패키지(슬롭스쿼팅)까지 잡아 공급망 공격을 막습니다.",
  reveal:true,
  html:'<div class="kicker">차별점 — 슬롭스쿼팅</div><div class="cards">'
   +card('중간','var(--med)',"'reqeusts' — 유명 패키지 'requests'의 오타·환각",'VG-SLOP','requirements.txt:1  reqeusts','slop')
   +card('중간','var(--med)',"'expres' — 'express'와 한 글자 차이",'VG-SLOP','package.json  "expres"','slop')
   +'</div><div class="sub" style="font-size:17px">공격자가 이런 이름을 미리 선점해 악성코드를 심습니다. 일반 도구는 놓치는 위협입니다.</div>'},
 {dur:11000,cap:"여기에 더해, 쓰고 있는 라이브러리의 알려진 취약점(CVE)도 실시간으로 확인합니다. 어제 공개된 취약점도 도구를 업데이트하지 않고 바로 반영됩니다.",
  reveal:true,
  html:'<div class="kicker">항상 최신 — 알려진 취약점(CVE)</div><div class="cards">'
   +card('높음','var(--high)','requests 2.5.0 — 인증정보 유출(CVE-2018-18074)','VG-CVE','requirements.txt:1  → 2.20.0 이상으로 업그레이드','cve')
   +card('중간','var(--med)','requests 2.5.0 — 최신 취약점 CVE-2026-25645','VG-CVE','requirements.txt:1  OSV.dev 실시간 조회','cve')
   +'</div><div class="sub" style="font-size:17px">취약점 목록을 도구에 내장하지 않고 OSV.dev에 물어봐, 항상 최신 상태로 점검합니다.</div>'},
 {dur:9000,cap:"모든 결과는 0부터 100까지 보안 점수로 요약됩니다. 이 앱은 0점, F등급이네요.",
  html:'<div class="kicker">한눈에</div><div class="score"><div class="ring"><div class="n">0</div></div>'
   +'<div><span class="gradeF">등급 F</span><div class="sub" style="margin-top:10px">치명적 문제가 있습니다. 배포 전에 반드시 고치세요.</div>'
   +'<div class="chips"><span class="chip"><span class="dot" style="background:var(--crit)"></span>치명적 4</span>'
   +'<span class="chip"><span class="dot" style="background:var(--high)"></span>높음 8</span>'
   +'<span class="chip"><span class="dot" style="background:var(--med)"></span>중간 6</span>'
   +'<span class="chip"><span class="dot" style="background:var(--low)"></span>낮음 1</span></div></div></div>'},
 {dur:10000,cap:"지난 검사들은 최신순으로 쌓여서, 언제든 다시 열어 볼 수 있습니다. 고치기 전과 후를 비교하기 좋습니다.",
  html:'<div class="kicker">이전 검사 결과</div>'
   +'<div class="winframe"><div class="winbar"><span class="wd r"></span><span class="wd y"></span><span class="wd g"></span><span class="apptt">VibeGuard — 이전 검사 결과</span></div>'
   +'<img src="../assets/app-history.png" class="shot" alt="이전 검사 결과 목록"></div>'},
 {dur:10000,cap:"코드 규칙 54개에 슬롭스쿼팅과 CVE 실시간 검사까지, 6개 언어 지원, 런타임 의존성 0. AI가 만든 코드를, 안전하게.",
  html:'<div class="brandrow"><div class="logo">'+SHIELD+'</div><div class="title">VibeGuard</div></div>'
   +'<div class="stat"><div><b>54</b><span>코드 규칙</span></div><div><b>6</b><span>지원 언어</span></div>'
   +'<div><b class="g">0</b><span>런타임 의존성</span></div></div>'
   +'<div class="sub" style="margin-bottom:6px">+ 슬롭스쿼팅 · 알려진 취약점(CVE) 실시간 검사</div>'
   +'<div class="sub">github.com/nohseongmin/VibeGuard · 오픈소스(MIT)</div>'},
];
var stage=document.getElementById('scene'),cap=document.getElementById('caption'),bar=document.getElementById('bar');
var startOv=document.getElementById('start'),doneTip=document.getElementById('done');
var SPEED=1.25;                       // 1.25배속
var synth=window.speechSynthesis,koVoice=null,started=false;

// 설계 크기(1040x585)를 화면에 맞춰 확대 — 1080p 전체화면에서 거의 꽉 차게 재생된다
function fit(){
  var d=document.documentElement;
  var w=innerWidth||d.clientWidth, h=innerHeight||d.clientHeight;
  var k=Math.min(w*0.97/1040, h*0.97/585);
  if(!isFinite(k)||k<=0) k=1;      // 크기를 못 읽는 상황에서도 화면이 사라지지 않게
  document.getElementById('stage').style.transform='scale('+k+')';
}
addEventListener('resize',fit);
addEventListener('load',fit);
addEventListener('fullscreenchange',fit);   // F11 전체화면 전환 직후 다시 맞춤
fit();

// 녹화 전 점검: 한국어 음성이 없으면 해설이 어색하거나 무음이 되므로 미리 알려준다
function pickVoice(){
  try{
    var v=synth.getVoices();
    koVoice=v.filter(function(x){return /^ko/i.test(x.lang||"")})[0]||null;
  }catch(e){}
  var box=document.getElementById('voicechk');
  if(!box) return;
  if(!synth){
    box.innerHTML='⚠️ 이 브라우저는 음성 해설을 지원하지 않습니다 — 자막으로 진행됩니다';
  }else if(koVoice){
    box.innerHTML='✅ 한국어 음성 준비됨 ('+koVoice.name+') &nbsp;<button id="voicetest">🔊 음성 테스트</button>';
  }else{
    box.innerHTML='⚠️ 한국어 음성 없음 — 해설이 어색할 수 있습니다 (설정 › 시간 및 언어 › 음성)'
      +' &nbsp;<button id="voicetest">🔊 음성 테스트</button>';
  }
  var btn=document.getElementById('voicetest');
  if(btn) btn.addEventListener('click',function(ev){
    ev.stopPropagation();                       // 테스트 버튼 클릭으로 재생이 시작되지 않도록
    try{
      synth.cancel();
      var u=new SpeechSynthesisUtterance('음성 테스트입니다. 이 소리가 들리면 녹화를 시작하세요.');
      u.lang='ko-KR'; if(koVoice)u.voice=koVoice;
      synth.speak(u);
    }catch(e){}
  });
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}else{pickVoice();}

var i=-1;
function next(){
  i++;
  if(i>=SCENES.length){                          // 마지막 장면을 그대로 유지(검은 화면으로 끝나지 않게)
    bar.style.width="100%";
    if(synth)try{synth.cancel()}catch(e){}
    document.title='■ 재생 완료 — 녹화를 멈추세요';
    setTimeout(function(){doneTip.style.opacity=1;},5000);
    return;
  }
  var s=SCENES[i];
  stage.classList.remove('on');
  setTimeout(function(){
    stage.innerHTML=s.html; cap.textContent=s.cap; stage.classList.add('on');
    if(s.reveal){var cs=stage.querySelectorAll('[data-card]');cs.forEach(function(c,k){setTimeout(function(){c.classList.add('show')},400+k*800)});}
    // 진행바는 '장면 번호 + 장면 내 진행률' 기준이라 실제 해설 길이와 어긋나지 않는다
    var seg=s.dur/SPEED, t0=Date.now();
    var iv=setInterval(function(){
      var p=(i+Math.min(1,(Date.now()-t0)/seg))/SCENES.length;
      bar.style.width=Math.min(100,p*100)+"%";
    },70);
    var done=false;function go(){if(done)return;done=true;clearInterval(iv);next();}
    if(synth&&s.cap){                 // 한국어 음성 해설(TTS)이 타이밍을 주도
      try{synth.cancel()}catch(e){}
      var u=new SpeechSynthesisUtterance(s.cap);u.lang='ko-KR';u.rate=1.25;if(koVoice)u.voice=koVoice;
      u.onend=function(){setTimeout(go,450)};
      u.onerror=function(){setTimeout(go,seg)};
      try{synth.speak(u)}catch(e){setTimeout(go,seg)}
      setTimeout(function(){go()},Math.max(seg,16000)+5000);   // 안전장치
    }else{setTimeout(go,seg);}
  },450);
}

// 3-2-1 카운트다운 — 클릭한 마우스를 치울 시간을 주고, 영상 도입부를 깔끔하게 만든다
function begin(){
  if(started)return; started=true;
  document.body.classList.add('playing');
  if(synth)try{                                  // 사용자 제스처 안에서 TTS 를 깨워 둔다
    synth.resume();
    var prime=new SpeechSynthesisUtterance(' ');prime.volume=0;synth.speak(prime);
  }catch(e){}
  startOv.innerHTML='<div id="cd">3</div>';
  var n=3;
  var t=setInterval(function(){
    n--;
    if(n<=0){clearInterval(t);startOv.style.display='none';next();return;}
    document.getElementById('cd').textContent=n;
  },800);
}
startOv.addEventListener('click',begin);
addEventListener('keydown',function(e){
  if(!started&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();begin();}
  if(e.key==='r'||e.key==='R'){location.reload();}   // R: 처음부터 다시(재녹화용)
});
</script>
