name: Build standalone executables

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VibeGuard-windows.exe
            src: dist/VibeGuard.exe
            extra: '--windowed --icon assets/icon.ico --add-data "assets/icon.ico;assets"'
          - os: macos-latest
            asset: VibeGuard-macos
            src: dist/VibeGuard
            extra: ""
          - os: ubuntu-latest
            asset: VibeGuard-linux
            src: dist/VibeGuard
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m pytest -q
      - run: python -m vibeguard scan vibeguard --offline --fail-on medium
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, vibeguard; assert os.environ['RELEASE_TAG'] == 'v' + vibeguard.__version__"
      - name: Build single-file executable
        shell: bash
        run: pyinstaller --onefile --name VibeGuard ${{ matrix.extra }} packaging/vibeguard_app.py
      - name: Rename asset and checksum
        shell: bash
        run: |
          mkdir -p out
          mv "${{ matrix.src }}" "out/${{ matrix.asset }}"
          python -c "import hashlib, pathlib; p=pathlib.Path('out/${{ matrix.asset }}'); pathlib.Path('out/${{ matrix.asset }}.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd out
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          rm -- *.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" * --clobber
          else
            gh release create "$RELEASE_TAG" * --verify-tag --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false
